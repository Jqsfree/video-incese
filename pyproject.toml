[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-incese"
version = "0.3.0"
description = "Extract model/reference + generated-video comparison segments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "opencv-python-headless>=4.8,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
video-incese = "video_incese:main"
video-incese-learn = "video_active:main"

[tool.setuptools]
py-modules = ["video_incese", "video_content", "video_temporal_cv", "video_active"]

[tool.pytest.ini_options]
testpaths = ["tests"]
